name: Actualizar semilla de datos

# Cada pocas horas recolecta de SEACE las licitaciones vigentes, guarda una foto
# en la rama `data` y avisa en Notion de las nuevas.
#
# Antes la foto se pedía al servidor de Render, pero SEACE bloquea la IP de
# Render durante días y la semilla quedaba vieja. Ahora la recolección corre
# aquí mismo: parte de la semilla anterior y baja de SEACE solo lo que falta,
# con el mismo ritmo (1 pedido cada 2 s) y las mismas pausas ante bloqueo que
# usa el servidor. Render solo la lee al despertar.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semilla
  cancel-in-progress: false

env:
  # Base de Notion "Licitaciones ≤ 8 UIT (SEACE)". El token va en el secreto NOTION_TOKEN.
  NOTION_DATABASE_ID: 043dc7ff539a49f4a5721d655b4dd12f

jobs:
  semilla:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: backend

      - name: Recolectar de SEACE (solo lo que falta)
        id: recolectar
        working-directory: backend
        env:
          SEACE_DB_PATH: ${{ runner.temp }}/seace.db
        run: |
          if node scripts/recolectar.mjs "$GITHUB_WORKSPACE/semilla.json.gz"; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SEACE no entregó datos frescos y completos esta vez; no se publica semilla ni se avisa."
            echo "listo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar la semilla
        id: validar
        if: steps.recolectar.outputs.listo == 'true'
        run: |
          if python3 .github/scripts/validar_semilla.py semilla.json.gz; then
            echo "valida=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::La semilla no pasó la validación; se conserva la anterior."
            echo "valida=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar en la rama data (un solo commit, sin historial)
        if: steps.validar.outputs.valida == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publicar && cp semilla.json.gz publicar/seed.json.gz
          cd publicar
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seed.json.gz
          git commit -q -m "Semilla de datos $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "Semilla publicada en la rama data."

      # Un fallo de Notion no debe impedir que la semilla se publique (ya se hizo arriba).
      - name: Avisar en Notion
        if: steps.validar.outputs.valida == 'true'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          AVISO_TIPOS: ${{ vars.AVISO_TIPOS }}
          AVISO_CIUDADES: ${{ vars.AVISO_CIUDADES }}
          AVISO_PALABRAS: ${{ vars.AVISO_PALABRAS }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::No hay secreto NOTION_TOKEN; se omite el aviso a Notion."
            exit 0
          fi
          python3 .github/scripts/avisar_notion.py semilla.json.gz
